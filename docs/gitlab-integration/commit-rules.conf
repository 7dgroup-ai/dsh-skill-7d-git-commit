# commit-rules.conf —— GitLab 服务端提交校验规则配置
# ============================================================================
# 用途：被 pre-receive hook 在运行时 source，控制校验行为与正则。
#       规则与脚本解耦——开发/运维团队只需改本文件，不动 pre-receive 脚本。
#
# 本文件是 @7dgroup/dsh-skill-7d-git-commit 插件的配套服务端规则模板，
# 默认与客户端 skill 引用的提交规范保持一致。
#
# 生效：改完本文件即时生效（下次 push 即用新规则），无需重启 Gitaly。
#       前提：本文件已部署到 gitlab-01 的 hook 目录。
#
# 部署位置（install-hooks.sh 会自动复制到以下路径之一）：
#   - 单仓试点：<repo>.git/custom_hooks/commit-rules.conf
#   - 全局推广：/var/opt/gitlab/gitaly/custom_hooks/commit-rules.conf
# ============================================================================


# ----------------------------------------------------------------------------
# 1. 运行模式（运维维护）
# ----------------------------------------------------------------------------
# MODE 控制命中违规后的处理方式：
#   warn    —— 观察期：违规仅写日志 + 终端告警，不拦截 push（首次上线推荐）
#   reject  —— 硬拦截：违规直接拒绝 push（观察期无问题后切换）
# 切换方式：改本行值 → 立即生效，无需任何重启。
MODE="warn"

# 审计日志路径（两种模式都写，观察期统计违规用）。需 git 用户可写。
# install-hooks.sh 会自动创建该文件并 chown git:git。
LOG_FILE="/var/log/gitlab/commit-check.log"


# ----------------------------------------------------------------------------
# 2. 提交标签正则（开发团队维护 —— 核心规则）
# ----------------------------------------------------------------------------
# COMMIT_REGEX：提交标题（subject）必须匹配的正则。
# 默认值对齐本项目 9 类中文标签：
#   【新增】【修复】【优化】【调整】【删除】【文档】【测试】【回滚】【合并】
#
# 正则要求：
#   - 用扩展正则（grep -E 语法，POSIX ERE）
#   - 用单引号包裹，避免 shell 解释特殊字符
#   - 标签须在行首（^），紧跟右括号】
COMMIT_REGEX='^【(新增|修复|优化|调整|删除|文档|测试|回滚|合并)】'


# ----------------------------------------------------------------------------
# 3. 长度与格式约束（开发团队维护）
# ----------------------------------------------------------------------------
# 标题最大长度（去标签后的描述部分，中文/字母/数字均计 1 字符）。
TITLE_MAX_LEN=50

# 标题是否禁止以句号或逗号结尾。
REJECT_TRAILING_PUNCT=true

# 正文单行最大字符数（作用于 commit body 每行）。
#   设为 0 表示不校验正文行宽。
#   仅统计"实际内容行"：空行与序号前缀不计入。
DETAIL_MAX_LEN=70


# ----------------------------------------------------------------------------
# 4. 字符与内容红线（开发团队维护）
# ----------------------------------------------------------------------------
# FORBIDDEN_CHARS：标题或正文中禁止出现的 ASCII 特殊符号。
FORBIDDEN_CHARS='@#$%^&*~'

# FORBIDDEN_PHRASES：禁止出现的临时标记/情绪化短语（grep -E 匹配，| 分隔）。
FORBIDDEN_PHRASES='待优化|后续再改|待修改|以后再说|TODO|FIXME|哈哈哈|666'


# ----------------------------------------------------------------------------
# 5. 旁路 / 豁免机制
# ----------------------------------------------------------------------------
# SKIP_KEYWORD：提交标题或正文中出现该关键词即跳过校验。
# 用途：紧急发版流水线、临时合并等场景。
# 注意：为防止滥用，使用关键词的提交仍会写一行 [BYPASS] 日志留痕。
SKIP_KEYWORD="[skip-check]"

# ALLOW_MERGE：是否豁免 Merge commit（标题以 "Merge " 开头）。
ALLOW_MERGE=true


# ----------------------------------------------------------------------------
# 6. 调试（排查问题时临时开启）
# ----------------------------------------------------------------------------
# DEBUG=true 时，hook 会把每个被检 commit 的 subject、正则、判定结果写到 stderr。
DEBUG=false
